schema_version = 1
id = "default"
display_name = "あまのじゃくゲーム"

[text]
title = "あまのじゃくゲーム"
start = "[S] スタート!"
skip_question = "遊び方の説明を見ますか？"
skip_yes = "[S] はい"
skip_no = "[E] スキップ"
emotion_map_title = "対応関係"
emotion_map_description = "左のあまのじゃくの表情と、右の人間の顔が対応するよ"
name_select_title = "プレイヤー名を選択"
countdown_start = "スタート！"
finish_title = "ゲーム終了"
instruction_lines = [
  "こんにちは。わたしは「あまのじゃく」のこども。",
  " 立派な「あまのじゃく」になるため、日々奮闘中。",
  "そこのあなた、「あまのじゃく」の見本を教えてくれない？",
  "わたしの顔（ニコニコ、ムカムカ、シクシク、ビックリ）と、ちがう顔をするの。",
  "「シーン（無感情）」や、「顔が映らない」と、",
  "ライフが減っちゃうから気をつけて！",
]

